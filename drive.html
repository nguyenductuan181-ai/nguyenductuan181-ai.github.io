<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Toàn Bộ Dữ Liệu Google Drive (Tài Liệu, Video, Sheets, Ảnh...)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #07090e;
    --card-bg: #0f1422;
    --card-hover: #182035;
    --border: #1b253b;
    --primary: #38bdf8;
    --accent: #818cf8;
    --text: #f8fafc;
    --text-muted: #94a3b8;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    padding: 12px;
    background: var(--bg);
    font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  .container { max-width: 1400px; margin: 0 auto; }
  header {
    text-align: center;
    padding: 18px 10px 12px;
  }
  header h1 {
    font-size: 22px;
    font-weight: 800;
    margin: 0 0 6px;
    background: linear-gradient(135deg, #38bdf8, #818cf8, #34d399);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .shield-tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(56, 189, 248, 0.1);
    border: 1px solid rgba(56, 189, 248, 0.25);
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 11.5px;
    color: #38bdf8;
    font-weight: 600;
  }
  
  .account-switcher {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin: 14px 0;
    flex-wrap: wrap;
  }
  .acc-tab {
    padding: 10px 16px;
    border-radius: 12px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    color: var(--text-muted);
    cursor: pointer;
    font-size: 13px;
    font-weight: 700;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .acc-tab.active {
    background: linear-gradient(135deg, #0284c7, #2563eb);
    border-color: var(--primary);
    color: #fff;
    box-shadow: 0 4px 16px rgba(2, 132, 199, 0.35);
  }
  .acc-count {
    background: rgba(0,0,0,0.3);
    padding: 2px 7px;
    border-radius: 14px;
    font-size: 11px;
  }

  .controls-bar {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
    flex-wrap: wrap;
    background: var(--card-bg);
    padding: 10px;
    border-radius: 14px;
    border: 1px solid var(--border);
    position: sticky;
    top: 8px;
    z-index: 40;
    backdrop-filter: blur(16px);
  }
  .search-input {
    flex: 1;
    min-width: 180px;
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #07090e;
    color: #fff;
    font-size: 13px;
    outline: none;
  }
  .search-input:focus { border-color: var(--primary); }
  
  .filter-group {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
  }
  .type-btn {
    padding: 6px 10px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: #07090e;
    color: var(--text-muted);
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
  }
  .type-btn.active {
    background: rgba(56, 189, 248, 0.15);
    border-color: var(--primary);
    color: var(--primary);
  }

  .file-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 10px;
  }
  @media (max-width: 640px) {
    .file-grid {
      grid-template-columns: 1fr;
      gap: 8px;
    }
  }

  .file-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    cursor: pointer;
    transition: transform 0.15s, border-color 0.15s;
  }
  .file-card:hover {
    transform: translateY(-2px);
    border-color: var(--primary);
    background: var(--card-hover);
  }
  .card-top {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 10px;
  }
  .file-icon { font-size: 20px; line-height: 1; }
  .file-title {
    font-size: 12.5px;
    font-weight: 600;
    line-height: 1.35;
    word-break: break-word;
    color: #f1f5f9;
  }
  .card-bottom {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 11px;
    color: var(--text-muted);
    border-top: 1px solid rgba(255,255,255,0.04);
    padding-top: 8px;
  }
  .tag {
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 10px;
    font-weight: 600;
  }
  .view-action {
    color: var(--primary);
    font-weight: 700;
    font-size: 11px;
    background: rgba(56, 189, 248, 0.08);
    padding: 3px 7px;
    border-radius: 5px;
  }

  /* Modal Viewer */
  #viewerModal {
    display: none;
    position: fixed;
    top: 0; left: 0; width: 100vw; height: 100vh;
    background: rgba(4, 7, 13, 0.96);
    z-index: 1000;
    flex-direction: column;
    backdrop-filter: blur(12px);
  }
  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    background: #0f1422;
    border-bottom: 1px solid var(--border);
  }
  .modal-title-box { max-width: 75vw; }
  .modal-title {
    font-size: 13px;
    font-weight: 700;
    color: #fff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .modal-close-btn {
    background: #1b253b;
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 6px 12px;
    font-weight: 700;
    cursor: pointer;
    font-size: 12px;
  }
  .modal-body {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 10px;
    overflow: hidden;
  }
  .modal-body img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    border-radius: 6px;
  }
  .modal-body iframe {
    width: 100%;
    height: 100%;
    border: none;
    border-radius: 6px;
    background: #fff;
  }
  .load-more {
    display: block;
    width: 180px;
    margin: 20px auto;
    padding: 10px;
    background: #0284c7;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
    text-align: center;
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>📂 Toàn Bộ Dữ Liệu Google Drive (2 Tài Khoản)</h1>
    <div><span class="shield-tag">🛡️ Đầy đủ: Docs, Sheets, PDF, Video, Thư mục, Ảnh • Xem Ẩn Danh 100%</span></div>
  </header>

  <div class="account-switcher">
    <div class="acc-tab active" id="tab-acc1" onclick="switchAccount('acc1')">
      <span>👤 nguyenductuan181@gmail.com</span>
      <span class="acc-count" id="count-acc1">0</span>
    </div>
    <div class="acc-tab" id="tab-acc2" onclick="switchAccount('acc2')">
      <span>👤 tamnguyenlethanh1399@gmail.com</span>
      <span class="acc-count" id="count-acc2">0</span>
    </div>
  </div>

  <div class="controls-bar">
    <input type="text" id="searchInput" class="search-input" placeholder="🔍 Tìm kiếm file/thư mục..." oninput="handleSearch()">
    <div class="filter-group">
      <button class="type-btn active" data-type="all" onclick="filterType('all', this)">Tất cả</button>
      <button class="type-btn" data-type="folder" onclick="filterType('folder', this)">📁 Thư mục</button>
      <button class="type-btn" data-type="doc" onclick="filterType('doc', this)">📝 Docs</button>
      <button class="type-btn" data-type="sheet" onclick="filterType('sheet', this)">📊 Sheets</button>
      <button class="type-btn" data-type="pdf" onclick="filterType('pdf', this)">📕 PDF</button>
      <button class="type-btn" data-type="video" onclick="filterType('video', this)">🎬 Video</button>
      <button class="type-btn" data-type="slide" onclick="filterType('slide', this)">📑 Slide</button>
      <button class="type-btn" data-type="image" onclick="filterType('image', this)">🖼️ Ảnh</button>
    </div>
  </div>

  <div style="font-size:12px; color:var(--text-muted); margin-bottom:10px;" id="statsInfo">Đang nạp dữ liệu...</div>

  <div class="file-grid" id="fileGrid"></div>
  <button id="loadMoreBtn" class="load-more" onclick="loadMore()" style="display:none;">Xem thêm 50 mục</button>
</div>

<div id="viewerModal">
  <div class="modal-header">
    <div class="modal-title-box">
      <div class="modal-title" id="modalTitle">File Viewer</div>
    </div>
    <button class="modal-close-btn" onclick="closeModal()">Đóng ✕</button>
  </div>
  <div class="modal-body" id="modalContent"></div>
</div>

<script>
let globalCatalog = null;
let currentAcc = 'acc1';
let currentType = 'all';
let filteredList = [];
let currentIndex = 0;
const PAGE_SIZE = 50;

fetch('full_drive_catalog.json?v=' + Date.now())
  .then(res => res.json())
  .then(data => {
    globalCatalog = data;
    document.getElementById('count-acc1').innerText = data.acc1.total + ' mục';
    document.getElementById('count-acc2').innerText = data.acc2.total + ' mục';
    updateFilter();
  });

function switchAccount(accKey) {
  currentAcc = accKey;
  document.getElementById('tab-acc1').classList.toggle('active', accKey === 'acc1');
  document.getElementById('tab-acc2').classList.toggle('active', accKey === 'acc2');
  updateFilter();
}

function filterType(typeKey, btn) {
  currentType = typeKey;
  document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  updateFilter();
}

function handleSearch() {
  updateFilter();
}

function updateFilter() {
  if (!globalCatalog) return;
  const acc = globalCatalog[currentAcc];
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  
  let list = acc.files;
  if (currentType !== 'all') {
    list = list.filter(f => f.cat === currentType);
  }
  if (q) {
    list = list.filter(f => f.name.toLowerCase().includes(q));
  }

  filteredList = list;
  currentIndex = 0;
  document.getElementById('fileGrid').innerHTML = '';
  document.getElementById('statsInfo').innerHTML = `Đang hiển thị <strong>${filteredList.length}</strong> / <strong>${acc.total}</strong> mục của <strong>${acc.email}</strong>`;

  renderChunk();
}

function renderChunk() {
  const grid = document.getElementById('fileGrid');
  const slice = filteredList.slice(currentIndex, currentIndex + PAGE_SIZE);

  if (currentIndex === 0 && slice.length === 0) {
    grid.innerHTML = '<div style="grid-column: 1/-1; text-align:center; padding: 40px; color:#64748b;">Không tìm thấy file nào</div>';
    document.getElementById('loadMoreBtn').style.display = 'none';
    return;
  }

  const html = slice.map(f => `
    <div class="file-card" onclick="viewItem('${f.id}', '${f.name.replace(/'/g, "\\'")}', '${f.cat}')">
      <div class="card-top">
        <span class="file-icon">${f.catLabel.split(' ')[0]}</span>
        <span class="file-title">${f.name}</span>
      </div>
      <div class="card-bottom">
        <span class="tag" style="background:${f.catColor}1a; color:${f.catColor}">${f.catLabel.split(' ')[1] || f.catLabel}</span>
        <span>${f.size || f.created || ''}</span>
        <span class="view-action">Mở xem 👁️</span>
      </div>
    </div>
  `).join('');

  grid.insertAdjacentHTML('beforeend', html);
  currentIndex += slice.length;
  document.getElementById('loadMoreBtn').style.display = (currentIndex < filteredList.length) ? 'block' : 'none';
}

function loadMore() {
  renderChunk();
}

function viewItem(id, name, cat) {
  const modal = document.getElementById('viewerModal');
  const modalTitle = document.getElementById('modalTitle');
  const modalContent = document.getElementById('modalContent');
  
  modalTitle.innerText = name;
  
  if (cat === 'image') {
    modalContent.innerHTML = `<img src="https://drive.google.com/thumbnail?id=${id}&sz=w1600" alt="${name}" onerror="this.src='https://lh3.googleusercontent.com/d/${id}=s1600'">`;
  } else if (cat === 'folder') {
    document.getElementById('searchInput').value = name;
    updateFilter();
    return;
  } else {
    modalContent.innerHTML = `<iframe src="https://drive.google.com/file/d/${id}/preview" allow="autoplay"></iframe>`;
  }
  
  modal.style.display = 'flex';
}

function closeModal() {
  document.getElementById('viewerModal').style.display = 'none';
  document.getElementById('modalContent').innerHTML = '';
}
</script>
</body>
</html>
