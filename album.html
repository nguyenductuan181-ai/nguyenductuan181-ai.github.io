<head>
  <meta charset="UTF-8">

  <title>Thư viện Ảnh Drive — tamnguyenlethanh13 (Mới nhất → Cũ nhất)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0B0F19; color: #F1F5F9; padding: 20px; }
    header { max-width: 1400px; margin: 0 auto 24px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px; border-bottom: 1px solid #1E293B; padding-bottom: 16px; }
    h1 { font-size: 20px; font-weight: 700; color: #38BDF8; display: flex; align-items: center; gap: 8px; }
    .controls { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .stats { font-size: 14px; color: #94A3B8; background: #1E293B; padding: 6px 14px; border-radius: 20px; }
    .search-box { width: 100%; max-width: 320px; }
    .search-box input { width: 100%; padding: 10px 16px; background: #1E293B; border: 1px solid #334155; border-radius: 8px; color: #fff; font-size: 14px; outline: none; }
    .search-box input:focus { border-color: #38BDF8; }
    .sort-select { padding: 10px 14px; background: #1E293B; border: 1px solid #334155; border-radius: 8px; color: #38BDF8; font-size: 14px; font-weight: 600; outline: none; cursor: pointer; }
    .gallery-grid { max-width: 1400px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
    .card { background: #131D31; border: 1px solid #1E293B; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; transition: transform 0.2s, border-color 0.2s; position: relative; }
    .card:hover { transform: translateY(-4px); border-color: #38BDF8; }
    .thumb-wrap { width: 100%; height: 200px; background: #0F172A; overflow: hidden; position: relative; cursor: pointer; }
    .thumb-wrap img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s; }
    .card:hover .thumb-wrap img { transform: scale(1.05); }
    .info { padding: 12px; display: flex; flex-direction: column; gap: 6px; }
    .name { font-size: 13px; font-weight: 600; color: #F8FAFC; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .meta { font-size: 11px; color: #64748B; display: flex; justify-content: space-between; }
    .btn-open { display: inline-flex; align-items: center; justify-content: center; gap: 4px; padding: 6px 10px; background: #1E293B; color: #38BDF8; text-decoration: none; border-radius: 6px; font-size: 12px; font-weight: 600; margin-top: 4px; transition: background 0.2s; }
    .btn-open:hover { background: #0284C7; color: #fff; }
  </style>
</head>

        <option value="size">💾 Dung lượng lớn nhất</option>
      </select>
      <div class="stats" id="stats">Tổng: 1353 ảnh</div>
    </div>
  </header>

    const grid = document.getElementById("grid");
    const stats = document.getElementById("stats");

    function render(list) {
      grid.innerHTML = list.map((item, idx) => `
        <div class="card">
          <div class="thumb-wrap" onclick="window.open('${item.link}', '_blank')">
            <img src="${item.thumb}" alt="${item.name}" loading="lazy" onerror="this.src='https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=400'">
          </div>
          <div class="info">
            <div class="name" title="${item.name}">${item.name}</div>
            <div class="meta">
              <span>📅 ${item.created_full}</span>
              <span>💾 ${(item.size / (1024*1024)).toFixed(1)} MB</span>
            </div>
            <a href="${item.link}" target="_blank" class="btn-open">🔗 Mở trên Drive</a>
          </div>
        </div>
      `).join("");
      stats.innerText = `Hiển thị: ${list.length} / ${images.length} ảnh`;
    }

    function applySort() {
      const mode = document.getElementById("sortOrder").value;
      if (mode === "desc") {
        images.sort((a, b) => b.created_full.localeCompare(a.created_full));
      } else if (mode === "asc") {
        images.sort((a, b) => a.created_full.localeCompare(b.created_full));
      } else if (mode === "name") {
        images.sort((a, b) => a.name.localeCompare(b.name));
      } else if (mode === "size") {
        images.sort((a, b) => b.size - a.size);
      }
      filterImages();
    }

    function filterImages() {
      const q = document.getElementById("search").value.toLowerCase();
      const filtered = images.filter(x => x.name.toLowerCase().includes(q));
      render(filtered);
    }

    render(images);
  </script>
