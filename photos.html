<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Kho Ảnh Đầy Đủ (Tải Nhanh & Ẩn Danh 100%)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #06090e;
    --card: #0e131f;
    --border: #1b253b;
    --primary: #38bdf8;
    --text: #f8fafc;
    --text-muted: #94a3b8;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    padding: 12px;
    background: var(--bg);
    font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
    color: var(--text);
  }
  .header {
    text-align: center;
    padding: 16px 8px;
    max-width: 800px;
    margin: 0 auto;
  }
  .header h1 {
    font-size: 22px;
    font-weight: 800;
    margin: 0 0 6px;
    background: linear-gradient(135deg, #38bdf8, #818cf8, #f472b6);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .header p {
    margin: 0;
    color: var(--text-muted);
    font-size: 13px;
  }
  .controls {
    display: flex;
    gap: 8px;
    max-width: 1200px;
    margin: 12px auto 16px;
    position: sticky;
    top: 8px;
    z-index: 40;
    background: rgba(14, 19, 31, 0.9);
    backdrop-filter: blur(16px);
    padding: 10px;
    border-radius: 14px;
    border: 1px solid var(--border);
  }
  .search-box {
    flex: 1;
    padding: 9px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #06090e;
    color: #fff;
    font-size: 13px;
    outline: none;
  }
  .search-box:focus { border-color: var(--primary); }
  
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 10px;
    max-width: 1400px;
    margin: 0 auto;
  }
  @media (max-width: 640px) {
    .grid {
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    aspect-ratio: 0.85;
  }
  .card:active { transform: scale(0.98); }
  .img-wrap {
    flex: 1;
    background: #000;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .img-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    background: #0b0f19;
  }
  .badge {
    position: absolute;
    bottom: 4px;
    right: 4px;
    background: rgba(0,0,0,0.7);
    font-size: 10px;
    font-weight: 600;
    padding: 2px 5px;
    border-radius: 4px;
    color: #e2e8f0;
  }
  .meta {
    padding: 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--card);
  }
  .title {
    font-size: 11.5px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: #f1f5f9;
    flex: 1;
  }
  
  /* Full screen Lightbox */
  #lightbox {
    display: none;
    position: fixed;
    top: 0; left: 0; width: 100vw; height: 100vh;
    background: rgba(0,0,0,0.96);
    z-index: 1000;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 10px;
    backdrop-filter: blur(10px);
  }
  #lightbox img {
    max-width: 96vw;
    max-height: 85vh;
    object-fit: contain;
    border-radius: 8px;
  }
  .close-btn {
    position: absolute;
    top: 14px; right: 14px;
    color: #fff; font-size: 28px; font-weight: bold;
    cursor: pointer;
    background: rgba(255,255,255,0.15);
    width: 40px; height: 40px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%;
  }
  .caption {
    margin-top: 12px;
    color: var(--text-muted);
    font-size: 13px;
    display: flex;
    gap: 12px;
    align-items: center;
  }
  .load-more-btn {
    display: block;
    width: 200px;
    margin: 24px auto;
    padding: 12px;
    background: #0284c7;
    color: #fff;
    border: none;
    border-radius: 10px;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    text-align: center;
  }
</style>
</head>
<body>
  <div class="header">
    <h1>📸 Kho Ảnh Đầy Đủ & Xem Nhanh 100%</h1>
    <p id="statsHeader">Đang kết nối thư viện ảnh...</p>
  </div>

  <div class="controls">
    <input type="text" id="searchInput" class="search-box" placeholder="🔍 Gõ tên ảnh để tìm nhanh (VD: JA, Noel, Gala, 242A...)" oninput="handleSearch()">
  </div>

  <div class="grid" id="photoGrid"></div>

  <button id="loadMoreBtn" class="load-more-btn" onclick="loadMore()" style="display:none;">Xem thêm 60 ảnh</button>

  <div id="lightbox" onclick="closeLightbox()">
    <div class="close-btn">&times;</div>
    <img id="lightboxImg" src="" alt="">
    <div class="caption">
      <span id="captionName"></span>
    </div>
  </div>

<script>
let allPhotos = [];
let filteredPhotos = [];
let currentIndex = 0;
const PAGE_SIZE = 60;

fetch('photos_data.json?v=' + Date.now())
  .then(res => res.json())
  .then(data => {
    allPhotos = data;
    filteredPhotos = data;
    document.getElementById('statsHeader').innerText = `Tổng cộng: ${allPhotos.length} ảnh • Tự động sửa lỗi hiển thị ảnh`;
    renderChunk();
  });

function getBestImageUrl(id, width) {
  // Triple-fallback image source pipeline
  return `https://drive.google.com/thumbnail?id=${id}&sz=w${width}`;
}

function handleSearch() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  filteredPhotos = q ? allPhotos.filter(p => p.name.toLowerCase().includes(q)) : allPhotos;
  currentIndex = 0;
  document.getElementById('photoGrid').innerHTML = '';
  renderChunk();
}

function renderChunk() {
  const grid = document.getElementById('photoGrid');
  const nextSlice = filteredPhotos.slice(currentIndex, currentIndex + PAGE_SIZE);
  
  if (currentIndex === 0 && nextSlice.length === 0) {
    grid.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:50px; color:#64748b;">Không tìm thấy ảnh phù hợp</div>';
    document.getElementById('loadMoreBtn').style.display = 'none';
    return;
  }

  const html = nextSlice.map(p => `
    <div class="card" onclick="openLightbox('${p.id}', '${p.name.replace(/'/g, "\'")}')">
      <div class="img-wrap">
        <img 
          src="https://drive.google.com/thumbnail?id=${p.id}&sz=w400" 
          alt="${p.name}" 
          loading="lazy"
          onerror="if(!this.dataset.fallback){this.dataset.fallback=1; this.src='https://lh3.googleusercontent.com/d/${p.id}=s400';} else if(this.dataset.fallback==1){this.dataset.fallback=2; this.src='https://lh3.googleusercontent.com/u/0/d/${p.id}=w400';}"
        >
        <div class="badge">${p.size || ''}</div>
      </div>
      <div class="meta">
        <span class="title" title="${p.name}">${p.name}</span>
      </div>
    </div>
  `).join('');

  grid.insertAdjacentHTML('beforeend', html);
  currentIndex += nextSlice.length;

  document.getElementById('loadMoreBtn').style.display = (currentIndex < filteredPhotos.length) ? 'block' : 'none';
}

function loadMore() {
  renderChunk();
}

function openLightbox(id, name) {
  const lb = document.getElementById('lightbox');
  const img = document.getElementById('lightboxImg');
  document.getElementById('captionName').innerText = name;
  
  // High-res preview with triple fallback
  img.src = `https://drive.google.com/thumbnail?id=${id}&sz=w1600`;
  img.onerror = function() {
    this.src = `https://lh3.googleusercontent.com/d/${id}=s1600`;
  };
  
  lb.style.display = 'flex';
}

function closeLightbox() {
  document.getElementById('lightbox').style.display = 'none';
  document.getElementById('lightboxImg').src = '';
}
</script>
</body>
</html>
