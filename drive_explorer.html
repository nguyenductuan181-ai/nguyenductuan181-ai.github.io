<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Trực Quan Google Drive 2 Tài Khoản</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0f19;
    --card-bg: #111827;
    --card-hover: #1f2937;
    --border: #1e293b;
    --primary: #38bdf8;
    --primary-glow: rgba(56, 189, 248, 0.15);
    --text: #f8fafc;
    --text-muted: #94a3b8;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    padding: 16px;
    background: var(--bg);
    font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
    color: var(--text);
  }
  .container {
    max-width: 1400px;
    margin: 0 auto;
  }
  header {
    text-align: center;
    padding: 24px 12px 16px;
  }
  header h1 {
    font-size: 26px;
    font-weight: 800;
    margin: 0 0 8px;
    background: linear-gradient(135deg, #38bdf8, #818cf8, #c084fc);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  header p {
    color: var(--text-muted);
    font-size: 14px;
    margin: 0;
  }
  
  .account-switcher {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin: 20px 0;
    flex-wrap: wrap;
  }
  .acc-tab {
    padding: 12px 20px;
    border-radius: 14px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    color: var(--text-muted);
    cursor: pointer;
    font-size: 14px;
    font-weight: 700;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .acc-tab.active {
    background: #0284c7;
    border-color: var(--primary);
    color: #fff;
    box-shadow: 0 4px 20px rgba(2, 132, 199, 0.4);
  }
  .acc-count {
    background: rgba(0,0,0,0.3);
    padding: 2px 8px;
    border-radius: 20px;
    font-size: 12px;
  }

  .controls-bar {
    display: flex;
    gap: 12px;
    margin-bottom: 20px;
    flex-wrap: wrap;
    background: var(--card-bg);
    padding: 12px;
    border-radius: 16px;
    border: 1px solid var(--border);
    position: sticky;
    top: 10px;
    z-index: 40;
    backdrop-filter: blur(16px);
  }
  .search-input {
    flex: 1;
    min-width: 220px;
    padding: 10px 16px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: #0b0f19;
    color: #fff;
    font-size: 14px;
    outline: none;
  }
  .search-input:focus {
    border-color: var(--primary);
  }
  .filter-group {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .type-btn {
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #0b0f19;
    color: var(--text-muted);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }
  .type-btn.active {
    background: var(--primary-glow);
    border-color: var(--primary);
    color: var(--primary);
  }

  .file-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 14px;
  }
  @media (max-width: 640px) {
    .file-grid {
      grid-template-columns: 1fr;
      gap: 10px;
    }
  }

  .file-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    transition: transform 0.15s, border-color 0.15s, background 0.15s;
    text-decoration: none;
    color: inherit;
  }
  .file-card:hover {
    transform: translateY(-2px);
    border-color: #38bdf8;
    background: var(--card-hover);
  }
  .card-top {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 12px;
  }
  .file-icon {
    font-size: 22px;
    line-height: 1;
  }
  .file-title {
    font-size: 13.5px;
    font-weight: 600;
    line-height: 1.4;
    word-break: break-word;
    color: #f1f5f9;
  }
  .card-bottom {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 11.5px;
    color: var(--text-muted);
    border-top: 1px solid rgba(255,255,255,0.05);
    padding-top: 10px;
  }
  .tag {
    padding: 2px 8px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 600;
  }
  .open-drive {
    color: var(--primary);
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .stats-info {
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 14px;
    font-weight: 500;
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>🌐 Trực Quan Dữ Liệu Google Drive</h1>
    <p>Tổng hợp toàn bộ tập tin & thư mục của 2 tài khoản kết nối</p>
  </header>

  <div class="account-switcher">
    <div class="acc-tab active" id="tab-acc1" onclick="switchAccount('account1')">
      <span>👤 nguyenductuan181@gmail.com</span>
      <span class="acc-count" id="count-acc1">0</span>
    </div>
    <div class="acc-tab" id="tab-acc2" onclick="switchAccount('account2')">
      <span>👤 tamnguyenlethanh1399@gmail.com</span>
      <span class="acc-count" id="count-acc2">0</span>
    </div>
  </div>

  <div class="controls-bar">
    <input type="text" id="searchInput" class="search-input" placeholder="🔍 Tìm kiếm file theo tên..." oninput="filterFiles()">
    <div class="filter-group">
      <button class="type-btn active" data-type="all" onclick="filterType('all', this)">Tất cả</button>
      <button class="type-btn" data-type="folder" onclick="filterType('folder', this)">📁 Thư mục</button>
      <button class="type-btn" data-type="image" onclick="filterType('image', this)">🖼️ Ảnh</button>
      <button class="type-btn" data-type="video" onclick="filterType('video', this)">🎬 Video</button>
      <button class="type-btn" data-type="doc" onclick="filterType('doc', this)">📝 Docs</button>
      <button class="type-btn" data-type="sheet" onclick="filterType('sheet', this)">📊 Sheets</button>
      <button class="type-btn" data-type="pdf" onclick="filterType('pdf', this)">📕 PDF</button>
    </div>
  </div>

  <div class="stats-info" id="statsInfo">Đang tải dữ liệu...</div>

  <div class="file-grid" id="fileGrid"></div>
</div>

<script>
let globalData = null;
let currentAcc = 'account1';
let currentType = 'all';

fetch('drive_data.json')
  .then(res => res.json())
  .then(data => {
    globalData = data;
    document.getElementById('count-acc1').innerText = data.account1.total + ' mục';
    document.getElementById('count-acc2').innerText = data.account2.total + ' mục';
    render();
  });

function switchAccount(accKey) {
  currentAcc = accKey;
  document.getElementById('tab-acc1').classList.toggle('active', accKey === 'account1');
  document.getElementById('tab-acc2').classList.toggle('active', accKey === 'account2');
  render();
}

function filterType(typeKey, btn) {
  currentType = typeKey;
  document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function filterFiles() {
  render();
}

function render() {
  if (!globalData) return;
  const acc = globalData[currentAcc];
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  
  let list = acc.files;
  if (currentType !== 'all') {
    list = list.filter(f => f.cat === currentType);
  }
  if (q) {
    list = list.filter(f => f.name.toLowerCase().includes(q));
  }

  document.getElementById('statsInfo').innerHTML = `Đang hiển thị <strong>${list.length}</strong> / <strong>${acc.total}</strong> mục của <strong>${acc.email}</strong>`;

  const grid = document.getElementById('fileGrid');
  if (list.length === 0) {
    grid.innerHTML = '<div style="grid-column: 1/-1; text-align:center; padding: 40px; color:#64748b;">Không tìm thấy file phù hợp</div>';
    return;
  }

  grid.innerHTML = list.map(f => `
    <a href="${f.url}" target="_blank" class="file-card">
      <div class="card-top">
        <span class="file-icon">${f.catLabel.split(' ')[0]}</span>
        <span class="file-title">${f.name}</span>
      </div>
      <div class="card-bottom">
        <span class="tag" style="background:${f.catColor}22; color:${f.catColor}">${f.catLabel.split(' ')[1] || f.catLabel}</span>
        <span>${f.size || ''}</span>
        <span class="open-drive">Mở Drive ↗</span>
      </div>
    </a>
  `).join('');
}
</script>
</body>
</html>
